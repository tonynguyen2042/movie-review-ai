name: CI

# The pipeline had no CI at all: nothing ran the test suite on a push or a
# pull request, so the three pipeline blockers -- a render stage that raised
# KeyError on every run, a quality gate that could not fail, and a manifest
# timed with a hard-coded number -- all reached master.
#
# The gate is the same four checks AGENTS.md STEP 11 names: pytest, ruff,
# ruff format and mypy. The coverage floor is the fifth.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The target is Apple Silicon, so macos is the platform that matters;
        # ubuntu catches the things that only break on Linux.
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the project
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy .

      - name: Test
        run: uv run pytest -q --cov=movie_review --cov-report=term-missing

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: .coverage
          if-no-files-found: ignore

  desktop:
    name: desktop checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Test the desktop shell
        working-directory: desktop
        run: npm test
