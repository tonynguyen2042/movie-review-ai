[project]
name = "movie-review-ai"
version = "0.1.0"
description = "Local-first AI pipeline that converts movies into review videos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.5.3",
  "pydantic>=2.0",
  "pydantic-settings>=2.15.0",
  "pyyaml>=6.0",
  "scenedetect>=0.7.1",
  "typer>=0.9",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.4",
  "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
movie-review = "movie_review.cli.app:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "scenedetect.*"
ignore_missing_imports = true
