[project]
name = "movie-review-ai"
version = "0.1.0"
description = "Local-first AI pipeline that converts movies into review videos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.20",
  "numpy>=2.5.3",
  "pydantic>=2.0",
  "pydantic-settings>=2.15.0",
  "pyyaml>=6.0",
  "scenedetect>=0.7.1",
  "typer>=0.9",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "ruff>=0.4",
  "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
movie-review = "movie_review.cli.app:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A typo in a marker name, or a bad ini option, must fail the run rather
# than be ignored.
addopts = "-ra --strict-markers --strict-config"
# An xfail that starts passing is a failure: the reason it was expected to
# fail is no longer true.
xfail_strict = true
# A hanging test blocks the run indefinitely.
timeout = 120
markers = [
  "ffmpeg: needs the ffmpeg and ffprobe binaries",
  "mlx: needs the MLX runtime, which is Apple-silicon only",
  "slow: takes a long time to run",
  "network: performs real network I/O",
]

[tool.coverage.run]
# The package under test. Everything else -- the tests, the desktop app -- is
# not part of it.
source = ["src/movie_review"]
branch = true

[tool.coverage.report]
# The gate. The suite measured 89.57% with branch coverage when the
# threshold was set; a point of headroom below that, so a platform
# difference does not fail the build for no reason. It only goes up.
fail_under = 88
show_missing = true
skip_covered = true
# The ports are abstract contracts: their bodies are `raise NotImplementedError`
# and a test that calls one is testing the wrong thing.
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The UI modules build HTML/CSS/JS inside f-string templates. Those long lines
# are embedded markup, not Python: ruff format cannot wrap them, and splitting
# a CSS rule or a tag across lines would make the templates harder to read.
# Real Python in these files is still held to the 100-column limit.
"src/movie_review/ui/*.py" = ["E501"]
"tests/unit/test_dashboard.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "scenedetect.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

# Test code is type-checked, but it is not required to be fully annotated.
# Everything that can find a real defect stays on: the argument-type,
# return-type, attribute, operator and generic-argument checks are exactly
# the ones that found 22 genuine bugs in the test suite -- a test that calls
# a function with the wrong argument type, a test that asserts on the
# return value of a function that returns None, a test that indexes a
# possibly-None string. Only the "you did not write an annotation" noise is
# turned off, because a test's annotations describe its own scaffolding
# rather than the contract the suite exists to check.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
