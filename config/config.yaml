# Configuration — movie-review-ai (T002; the two-file layout was merged in T182).
# One file: the product controls on top, the model profile catalog under
# `profiles`.
# Precedence: init kwargs > MOVIE_REVIEW_* env vars > this file > code
# fallbacks. The CLI's --config flag (or MOVIE_REVIEW_CONFIG) points the
# pipeline at a different file with the same shape.
# Source-footage limits are product controls, NOT a legal guarantee.

models:
  # The profile NAME from the `profiles` catalog below; the full model
  # identities live there.
  profile: balanced

pipeline:
  scene_detection:
    detector: adaptive
    threshold: null
    min_scene_len: 15
  visual_sampling:
    mode: adaptive
    short_threshold: 10.0
    medium_threshold: 60.0
    short_frames: 3
    medium_frames: 6
    long_frames: 12
    # Drop near-duplicate frames (a held shot sampled twice is one picture).
    dedupe: true
    # dHash bits: frames differing by at most this many bits are duplicates.
    dedupe_hamming_threshold: 5
  diarization: true
  review:
    target_duration_minutes: 20
    target_wpm: 150
  rendering:
    width: 1920
    height: 1080
    fps: 30
    preset: veryfast
    crf: 23

source_video:
  max_clip_seconds: 8.0
  preferred_clip_seconds: 3.0
  max_source_ratio: 0.35
  max_total_seconds: 420.0

paths:
  data_dir: data
  output_dir: data/output

# The optional music bed (README section 43). Local assets only, off by
# default. Set `track` to a local file to enable it.
music:
  enabled: false
  track: null
  gain: 1.0

privacy:
  cloud_ai: false

interaction:
  # Pause before every pipeline stage that needs a model, so a machine that
  # cannot hold every model at once has time to swap the loaded one. The
  # pause is per stage, not per model call. The CLI's --auto-accept overrides
  # this for one run, and MOVIE_REVIEW_INTERACTION__AUTO_ACCEPT overrides it
  # for every run.
  auto_accept: false

prompts:
  # The pinned version of every prompt that exists. A prompt that is not
  # listed here uses its newest version. The names below are the files in
  # config/prompts/; the registry used to name five prompts that were never
  # written, and the five that were written were not listed.
  versions:
    critic: v1
    event_extraction: v1
    publishing_metadata: v1
    scene_analysis: v1
    script_writer: v1
    story_arc: v1
    theme: v1
    translate: v1
    twist: v1

logging:
  level: INFO

media:
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  proxy:
    max_width: 1280
    max_height: 720
    preset: veryfast
    crf: 23

# Model catalog (T002). Profiles per README section 56. The active profile is
# selected via `models.profile` above, the CLI's --profile flag, or
# MOVIE_REVIEW_MODELS__PROFILE. Exact checkpoints are benchmark-driven
# (T074-T077); edit here, not in code.
profiles:
  fast:
    asr:
      model: whisper-large-v3-turbo
      precision: fp16
    vision:
      model: Qwen3-VL-small
      precision: 4bit
    reasoning:
      model: Qwen3.5-9B
      precision: 4bit
    critic:
      model: Qwen3.5-9B
      precision: 4bit
      enabled: false
    tts:
      model: Qwen3-TTS-0.6B
      precision: 8bit

  balanced:
    asr:
      model: whisper-large-v3-turbo
      precision: fp16
    vision:
      model: Qwen3-VL
      precision: 4bit
    reasoning:
      model: Qwen3.5-27B
      precision: 4bit
    critic:
      model: Qwen3.5-122B-A10B
      precision: 4bit
      enabled: false
    tts:
      model: Qwen3-TTS-12Hz-1.7B
      precision: 8bit

  quality:
    asr:
      model: whisper-large-v3-turbo
      precision: fp16
    vision:
      model: Qwen3-VL-large
      precision: 4bit
    reasoning:
      model: Qwen3.5-27B
      precision: 4bit
    critic:
      model: Qwen3.5-122B-A10B
      precision: 4bit
      enabled: true
    tts:
      model: Qwen3-TTS-12Hz-1.7B
      precision: 8bit

  # Remote profile: models run on another host (GPU box, home server) behind
  # OpenAI-compatible endpoints -- vLLM, faster-whisper-server, llama.cpp
  # server, LM Studio, Ollama, or TGI. Select with either:
  #   models.profile: remote            (in this file)
  #   --profile remote                  (one CLI run)
  #   export MOVIE_REVIEW_MODELS__PROFILE=remote
  #
  # `backend: openai_compatible` routes that slot over HTTP instead of loading
  # local MLX weights. `precision` is then ignored -- the remote server decides
  # how weights are loaded. Slots are independent: leave `backend: mlx` on a
  # slot to keep that one local while the rest run remotely.
  #
  # Paths the remote adapters use (base_url may include /v1 or be a bare host):
  #   asr       -> POST {base}/audio/transcriptions  (multipart; needs
  #                response_format=verbose_json for timestamps)
  #   vision    -> POST {base}/chat/completions     (base64 image_url parts)
  #   reasoning -> POST {base}/chat/completions
  #   translation -> POST {base}/chat/completions   (own slot; defaults to
  #                `reasoning` when a profile omits it)
  #   tts       -> POST {base}/audio/speech         (wav or headerless pcm)
  #
  # Servers that spell the ASR route differently: whisper.cpp's `whisper-server`
  # serves POST {base}/inference and has no /audio/transcriptions at all, so a
  # request to the OpenAI path comes back 404 from an otherwise healthy server.
  # It returns the same verbose_json segment shape, so only the route changes:
  #
  #   asr:
  #     endpoint_path: /inference
  #
  #
  # TTS: ask for `wav` so duration can be measured from the bytes. `mp3` is
  # rejected deliberately rather than guessed, since a wrong duration
  # corrupts subtitle timing.
  #
  # Credentials: put the NAME of an environment variable in `api_key_env`, never
  # the secret itself, so tokens stay out of version control. Leave it unset for
  # servers needing no auth (a LAN vLLM usually needs none).
  #
  # Retries: `attempts` is the number of attempts for ONE request, so 4 means
  # the first try plus three retries. `backoff_seconds` is the base of an
  # exponential, jittered wait between them and `max_backoff_seconds` caps a
  # single sleep. Only 429s, 5xx, timeouts and dropped connections are retried:
  # a 4xx is the request's own fault and is reported on the first answer. A 5xx
  # or a rate limit that outlives the schedule is reported as "unavailable", so
  # the stage-level retry gets a second, cheaper chance (the per-scene cache
  # means a retried stage does not redo the scenes it already analysed).
  remote:
    asr:
      model: whisper-large-v3-turbo
      backend: openai_compatible
      # The whisper.cpp server serves /inference. The OpenAI-compatible
      # route is /v1/audio/transcriptions, which this server does not
      # have -- a request to it comes back 404, and the transcript stage
      # never runs.
      base_url: http://192.168.1.144:9000
      endpoint_path: /inference
      # api_key_env: MOVIE_REVIEW_ASR_TOKEN
      timeout_seconds: 600
    vision:
      model: Qwen3-VL
      backend: openai_compatible
      base_url: http://192.168.1.144:8000/v1
      # api_key_env: MOVIE_REVIEW_LLM_TOKEN
      timeout_seconds: 300
      # A vLLM engine that answers 500 after an OOM or a restart needs longer
      # than the transport default (3 attempts, 0.5 s apart, ~1.5 s in total)
      # to come back. Four attempts at 5 s, 10 s and 20 s wait about 35 s,
      # which is roughly how long the engine takes to reload, and costs one
      # scene instead of the whole stage when the host really is broken.
      attempts: 4
      backoff_seconds: 5
      max_backoff_seconds: 30
    reasoning:
      model: Qwen3.5-27B
      backend: openai_compatible
      base_url: http://192.168.1.144:8000/v1
      # api_key_env: MOVIE_REVIEW_LLM_TOKEN
      timeout_seconds: 120
      # Same host, same restart window: a reasoning stage that gives up after
      # 1.5 s throws away every event it has already extracted.
      attempts: 4
      backoff_seconds: 5
      max_backoff_seconds: 30
    critic:
      model: Qwen3.5-27B
      backend: openai_compatible
      base_url: http://192.168.1.144:8000/v1
      enabled: false
    # Translation gets its own slot so it can be a different size, a different
    # quantisation, or a different host from the reasoning model -- without
    # touching the reasoning model for every other reasoning stage. Omit the
    # slot in a profile and translation borrows `reasoning`, which is what it did
    # before the slot existed. It runs only when --target-language differs from
    # --language; a same-language run never calls it.
    translation:
      model: Qwen3.5-9B
      backend: openai_compatible
      base_url: http://192.168.1.144:8000/v1
      # api_key_env: MOVIE_REVIEW_TRANSLATION_TOKEN
      timeout_seconds: 120
    tts:
      model: Qwen3-TTS-12Hz-1.7B
      backend: openai_compatible
      base_url: http://192.168.1.144:8000/v1
      timeout_seconds: 120